spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/demo_contacts}
    username: ${DB_USERNAME:demo}
    password: ${DB_PASSWORD:demo_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-32-chars-min}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:1800}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.demo.app: DEBUG
    org.springframework.security: DEBUG
  structured:
    format:
      console: ecs
