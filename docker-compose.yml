services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: demo_contacts
      POSTGRES_USER: ${DB_USERNAME:-demo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-demo} -d demo_contacts"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
